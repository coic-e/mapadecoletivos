version: '3.8'

services:
  database:
    image: postgres
    container_name: database
    restart: always
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=mapadecoletivos
      - POSTGRES_DB=mapadecoletivos
    volumes:
      - pgdata:/data/postgres
    networks:
      - mapadecoletivos-network
  rust-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mapadecoletivos-rust-api
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://docker:mapadecoletivos@database:5432/mapadecoletivos
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - UPLOAD_DIR=uploads
      - MAX_FILE_SIZE=10485760
      - BASE_URL=http://localhost:8080
      - RUST_LOG=info
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - database
    networks:
      - mapadecoletivos-network

  # Reference to shared database from TypeScript API
  # This assumes the database service is already running from mapadecoletivos-api/docker-compose.yml
  # To use both APIs simultaneously, they should share the same database service

networks:
  mapadecoletivos-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
