services:
  database:
    image: postgres:16-alpine
    container_name: rave-map-db
    restart: always
    # Só o localhost da máquina que roda o compose. Sem o 127.0.0.1, o Docker
    # publica a porta em todas as interfaces e o Postgres fica exposto na rede
    # — com a senha que está versionada neste arquivo.
    ports:
      - 127.0.0.1:5432:5432
    environment:
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      - POSTGRES_DB=rave_map
      - PGDATA=/data/postgres
    volumes:
      - pgdata:/data/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker -d rave_map"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rave-map-network
  # Bucket local compatível com S3.
  #
  # RustFS no lugar do MinIO: o MinIO teve o console removido da edição
  # comunitária em 2025 e o repositório foi arquivado em abril de 2026. Isto
  # aqui é ambiente de desenvolvimento; em produção o destino é o Cloudflare R2,
  # e a API não sabe a diferença — muda endpoint e credenciais.
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rave-map-rustfs
    restart: unless-stopped
    environment:
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY:?defina S3_ACCESS_KEY no .env}
      - RUSTFS_SECRET_KEY=${S3_SECRET_KEY:?defina S3_SECRET_KEY no .env}
      # 0.0.0.0 e não ":9000": com o endereço só com a porta, o RustFS escuta
      # apenas em IPv6, e o Docker encaminha a porta publicada para o IPv4 do
      # container — a conexão é recusada e o container não registra nada.
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
    ports:
      # 9000 é a API do bucket, 9001 é o console web. Só no localhost.
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    volumes:
      # Volume nomeado, não bind mount: a imagem roda como uid 10001 e um
      # diretório do host entraria com o dono do host, sem permissão de escrita.
      - rustfs:/data
    command: /data
    networks:
      - rave-map-network

  # Cria o bucket e libera leitura anônima. Roda uma vez e sai; a API espera
  # ele terminar, senão o primeiro upload encontraria bucket inexistente.
  #
  # A política é escrita à mão em vez de um atalho de "tornar público": liberar
  # ListBucket junto entregaria o nome de toda imagem enviada, inclusive de
  # cadastro pendente ou rejeitado. Aqui só GetObject é permitido.
  rustfs-init:
    image: amazon/aws-cli:latest
    container_name: rave-map-rustfs-init
    depends_on:
      rustfs:
        condition: service_started
    environment:
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY:?defina S3_ACCESS_KEY no .env}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY:?defina S3_SECRET_KEY no .env}
      - AWS_DEFAULT_REGION=${S3_REGION:-us-east-1}
      - BUCKET=${S3_BUCKET:-rave-map}
    entrypoint: >
      sh -c "
      until aws --endpoint-url http://rustfs:9000 s3 ls >/dev/null 2>&1; do sleep 1; done &&
      (aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket $${BUCKET} || true) &&
      printf '%s' '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::'$${BUCKET}'/*\"]}]}' > /tmp/policy.json &&
      aws --endpoint-url http://rustfs:9000 s3api put-bucket-policy --bucket $${BUCKET} --policy file:///tmp/policy.json
      "
    networks:
      - rave-map-network

  rust-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rave-map-rust-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://docker:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@database:5432/rave_map
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      # Bucket das imagens. O endpoint é o nome do serviço na rede do compose;
      # a base pública é como o navegador chega lá, de fora.
      - S3_ENDPOINT=http://rustfs:9000
      - S3_BUCKET=${S3_BUCKET:-rave-map}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:?defina S3_ACCESS_KEY no .env}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?defina S3_SECRET_KEY no .env}
      - S3_PUBLIC_BASE_URL=${S3_PUBLIC_BASE_URL:-http://localhost:9000/rave-map}
      - S3_REGION=${S3_REGION:-us-east-1}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-5242880}
      - MAX_FILES_PER_REQUEST=${MAX_FILES_PER_REQUEST:-6}
      - BASE_URL=${BASE_URL:-http://localhost:8080}
      # Quem pode chamar a API pelo navegador. Nunca "*".
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Assina os tokens dos moderadores. Sem valor padrão de propósito: um
      # segredo escrito neste arquivo é um segredo público, e a API recusa
      # subir com os de exemplo. Gere com: openssl rand -base64 48
      - JWT_SECRET=${JWT_SECRET:?defina JWT_SECRET no .env}
      - JWT_TTL_HOURS=${JWT_TTL_HOURS:-8}
      # Ligue só se houver um proxy reescrevendo X-Forwarded-For na frente.
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - RUST_LOG=info
    depends_on:
      database:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    # O container não precisa escrever em lugar nenhum além de uploads e /tmp.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - rave-map-network

networks:
  rave-map-network:
    driver: bridge

volumes:
  pgdata:
  rustfs:
