server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Não anunciar a versão do nginx em cada resposta e em página de erro.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Arquivos com hash no nome nunca mudam de conteúdo: podem ser guardados
    # para sempre. É o que evita rebaixar o bundle a cada visita.
    # O ^~ é obrigatório: sem ele, o bloco de expressão regular abaixo tem
    # precedência sobre este e o bundle sai sem Cache-Control nenhum.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # O index.html, ao contrário, não pode ser cacheado: é ele que aponta para
    # o bundle novo depois de um deploy. Cacheado, o navegador continuaria
    # pedindo o bundle antigo, que já não existe.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Arquivo com extensão que não existe é 404 de verdade, não index.html.
    # Sem esta regra, uma imagem quebrada responde 200 com uma página HTML: o
    # navegador não detecta a falha, o rastreador indexa lixo e a depuração
    # vira caça ao fantasma.
    location ~* \.(?:png|jpe?g|gif|webp|svg|ico|css|js|map|json|txt|xml|woff2?|ttf)$ {
        # Estes não têm hash no nome, então podem mudar sem trocar de URL: uma
        # hora de cache, não um ano.
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Rota de SPA: o roteador vive no navegador, então qualquer caminho
    # desconhecido devolve o index.html em vez de 404 do servidor. Sem isto,
    # abrir /raves direto ou apertar F5 lá dentro quebra.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
