# Os mesmos comandos que o README manda rodar antes de abrir PR, só que sem
# depender de alguém lembrar — e, no que entra na main, o disparo do deploy.
#
# As ações de terceiro vêm presas ao commit, não à tag: tag é um ponteiro
# móvel, e quem controlasse o repositório da ação poderia reapontá-la para
# outro código — que rodaria aqui dentro, com acesso ao checkout.
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

# O padrão do GitHub dá escrita; aqui nada precisa disso.
permissions:
  contents: read

# Push novo na mesma branch cancela a execução anterior: o resultado dela já
# não interessa a ninguém.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest

    services:
      # Os testes de banco precisam de um Postgres de verdade. É descartável e
      # some com o job, que é exatamente o que TEST_DATABASE_URL pede.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rave_map_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rave_map_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # O diesel com a feature postgres linka contra a libpq.
      - name: Instalar a libpq
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Preparar o toolchain
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Formatação
        run: cargo fmt --all --check

      # -D warnings porque sem isso o clippy avisa e o job passa mesmo assim.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Testes
        run: cargo test --workspace

  app:
    name: app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    # O app valida as variáveis na subida e morre sem elas, então o lint, os
    # testes e o build precisam de algum valor. São placeholders de propósito:
    # o bundle daqui é descartado, e um token real de Mapbox num repositório
    # público vazaria para qualquer PR vindo de fork.
    env:
      VITE_MAPBOX_USERNAME: ci
      VITE_MAPBOX_STYLE_ID: ci
      VITE_MAPBOX_ACCESS_TOKEN: ci
      VITE_API_URL: http://localhost:8080

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # `npm ci` e não `npm install`: instala exatamente o que está no lock e
      # falha se o lock estiver fora de sincronia com o package.json.
      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npx tsc --noEmit

      - name: Testes
        run: npx vitest run

      - name: Build
        run: npm run build

  docker:
    name: docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # O deploy é feito por painel (EasyPanel/Coolify/Dokploy), que constrói a
      # imagem a partir deste repositório. Sem este passo, um Dockerfile
      # quebrado só aparece na hora de subir para produção.
      #
      # O contexto é a raiz de propósito: a API é um crate de um workspace e o
      # primeiro COPY precisa enxergar api-types e db-types.
      - name: Construir a imagem da API
        run: docker build -f Dockerfile .

  # --------------------------------------------------------------- deploy

  # Quais serviços a mudança alcança.
  #
  # Sem isto, uma correção de CSS reconstrói a imagem da API no painel e
  # vice-versa: deploy à toa, e minutos de espera para quem está olhando.
  changes:
    name: changes
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      api: ${{ steps.filter.outputs.api }}
      app: ${{ steps.filter.outputs.app }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Precisa do histórico para comparar com o commit anterior.
          fetch-depth: 0

      - id: filter
        # Os valores entram por env em vez de irem interpolados no script: é
        # como se escreve passo de shell no Actions, mesmo quando o valor vem
        # do próprio GitHub e não de quem abriu o PR.
        env:
          ANTES: ${{ github.event.before }}
          AGORA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Sem base de comparação — primeiro push, force-push, histórico
          # truncado — sobe os dois, que é o lado seguro de errar.
          if [ -z "${ANTES:-}" ] \
            || [ "$ANTES" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
            echo "sem base de comparação: subindo os dois"
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mudou=$(git diff --name-only "$ANTES" "$AGORA")
          echo "Arquivos alterados:"
          echo "$mudou"

          # O Dockerfile e o Cargo.lock da raiz são da API: é o que a imagem
          # dela constrói.
          if echo "$mudou" | grep -qE '^(api-rust/|api-types/|db-types/|Cargo\.(toml|lock)|Dockerfile)'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$mudou" | grep -qE '^app/'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-api:
    name: deploy-api
    runs-on: ubuntu-latest
    # Só depois dos três verdes. `changes` não roda em PR, e job que depende de
    # job pulado é pulado junto — então isto nunca dispara fora da main.
    needs: [rust, app, docker, changes]
    if: needs.changes.outputs.api == 'true'
    environment: api

    steps:
      - name: Disparar o deploy da API no EasyPanel
        env:
          HOOK: ${{ secrets.EASYPANEL_DEPLOY_HOOK_API }}
        run: |
          set -euo pipefail

          if [ -z "${HOOK:-}" ]; then
            echo "::error::EASYPANEL_DEPLOY_HOOK_API não está configurado"
            exit 1
          fi

          # Só o código de status sai no log. O log de Actions de repositório
          # público é visível para qualquer pessoa, e o token do EasyPanel vai
          # dentro da própria URL do hook — o corpo da resposta pode devolvê-la.
          codigo=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$HOOK")
          echo "EasyPanel respondeu $codigo"

          [ "$codigo" -ge 200 ] && [ "$codigo" -lt 300 ]

  deploy-app:
    name: deploy-app
    runs-on: ubuntu-latest
    needs: [rust, app, docker, changes]
    if: needs.changes.outputs.app == 'true'
    environment: app

    steps:
      - name: Disparar o deploy do front no EasyPanel
        env:
          HOOK: ${{ secrets.EASYPANEL_DEPLOY_HOOK_APP }}
        run: |
          set -euo pipefail

          if [ -z "${HOOK:-}" ]; then
            echo "::error::EASYPANEL_DEPLOY_HOOK_APP não está configurado"
            exit 1
          fi

          codigo=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$HOOK")
          echo "EasyPanel respondeu $codigo"

          [ "$codigo" -ge 200 ] && [ "$codigo" -lt 300 ]
