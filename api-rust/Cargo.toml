[package]
name = "api-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-rt = "2"
actix-cors = "0.7"
actix-multipart = "0.6"
actix-files = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
diesel = { version = "2", features = ["postgres", "r2d2", "chrono", "numeric"] }
validator = { version = "0.18", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.11"
dotenv = "0.15"
thiserror = "1"
log = "0.4"
futures-util = "0.3"
bigdecimal = { version = "0.4", features = ["serde"] }

[dev-dependencies]
actix-test = "0.1"
