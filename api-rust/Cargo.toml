[package]
name = "api-rust"
version = "0.1.0"
edition = "2021"
# Com create_admin no pacote, `cargo run` sem argumento ficaria ambíguo.
default-run = "api-rust"

[dependencies]
api-types = { path = "../api-types" }
db-types = { path = "../db-types" }
actix-web = "4"
actix-rt = "2"
actix-cors = "0.7"
actix-multipart = "0.6"
actix-files = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
diesel = { version = "2", features = ["postgres", "r2d2", "chrono", "numeric"] }
validator = { version = "0.21", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.11"
dotenvy = "0.15"
thiserror = "1"
log = "0.4"
futures-util = "0.3"
bigdecimal = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
jsonwebtoken = "9"
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "rustls", "sigv4a"] }
diesel_migrations = "2"
async-trait = "0.1"

[dev-dependencies]
actix-test = "0.1"
# Os testes de integração montam cenário direto no banco.
diesel = { version = "2", features = ["postgres", "r2d2"] }
bigdecimal = { version = "0.4" }
actix-http = "3"
